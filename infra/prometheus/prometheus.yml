global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "autoparts"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # .NET сервисы отдают метрики на /metrics (пакет prometheus-net.AspNetCore)
  - job_name: "catalog-api"
    static_configs:
      - targets: ["catalog-api:8080"]
    metrics_path: /metrics

  - job_name: "orders-api"
    static_configs:
      - targets: ["orders-api:8080"]
    metrics_path: /metrics

  - job_name: "inventory-api"
    static_configs:
      - targets: ["inventory-api:8080"]
    metrics_path: /metrics

  - job_name: "notifications-api"
    static_configs:
      - targets: ["notifications-api:8080"]
    metrics_path: /metrics

  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  # RabbitMQ Prometheus plugin (включён по умолчанию в rabbitmq:3.13)
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Redis exporter (опционально, добавить redis-exporter сервис)
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
