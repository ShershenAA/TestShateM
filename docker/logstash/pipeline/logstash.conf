input {
  beats {
    port => 5044
  }
  # Получаем логи от .NET сервисов по TCP в JSON формате
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [fields][service] {
    mutate {
      add_field => { "service_name" => "%{[fields][service]}" }
    }
  }

  # Парсим уровень логирования Serilog
  if [level] {
    mutate {
      lowercase => ["level"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "autoparts-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
