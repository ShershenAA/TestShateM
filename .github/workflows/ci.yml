name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/services/AutoParts.sln

      - name: Build
        run: dotnet build src/services/AutoParts.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test src/services/AutoParts.sln --no-build --configuration Release --verbosity normal
  
  test-frontend:
    name: Build Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: angular-client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: angular-client

      - name: Build
        run: npm run build
        working-directory: angular-client
        
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]  # запускается только если тесты прошли

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Catalog API
        run: docker build -f Dockerfile.catalog -t autoparts-catalog:${{ github.sha }} .

      - name: Build Orders API
        run: docker build -f Dockerfile.orders -t autoparts-orders:${{ github.sha }} .

      - name: Build Inventory API
        run: docker build -f Dockerfile.inventory -t autoparts-inventory:${{ github.sha }} .

      - name: Build Notifications API
        run: docker build -f Dockerfile.notifications -t autoparts-notifications:${{ github.sha }} .

      - name: Build Gateway
        run: docker build -f Dockerfile.gateway -t autoparts-gateway:${{ github.sha }} .
      
      - name: Build Angular Client
        run: docker build -f Dockerfile.angular -t autoparts-angular:${{ github.sha }} .